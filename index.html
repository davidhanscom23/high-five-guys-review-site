<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How was your experience? | The High 5 Guys</title>
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="How was your experience? | The High 5 Guys">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<style>html,body{margin:0;padding:0}</style>
</head>
<body>
<style>
  .h5g-wrap{
    --brand:#E60000;--brand-dark:#B80000;--star:#FFBF00;--star-empty:#D9DEE7;
    --ink:#111111;--muted:#555B66;--card:#fff;--radius:22px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);position:fixed;inset:0;overflow-y:auto;min-height:100vh;width:100%;
    display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;
    background:linear-gradient(155deg,#0b0b0b 0%,#161616 55%,#7a0000 100%);
  }
  .h5g-wrap *{box-sizing:border-box}
  .h5g-card{
    width:100%;max-width:460px;background:var(--card);border-radius:var(--radius);
    padding:36px 34px 26px;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);
    text-align:center;position:relative;overflow:hidden;
    animation:h5grise .5s cubic-bezier(.2,.7,.2,1) both;
  }
  .h5g-card::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;
    background:linear-gradient(90deg,var(--ink),var(--brand))}
  @keyframes h5grise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .h5g-logo{height:96px;width:auto;margin:6px auto 6px;display:block}
  .h5g-wordmark{font-size:13px;font-weight:800;letter-spacing:.32em;color:var(--ink);margin-bottom:22px;text-transform:uppercase}
  .h5g-card h1{font-size:23px;line-height:1.3;font-weight:800;margin:0 0 8px;letter-spacing:-.01em}
  .h5g-sub{font-size:15px;color:var(--muted);margin:0 0 26px;line-height:1.5}
  .h5g-stars{display:flex;justify-content:center;gap:8px;margin:6px 0}
  .h5g-star{width:46px;height:46px;cursor:pointer;color:var(--star-empty);transition:transform .12s,color .12s}
  .h5g-star svg{width:100%;height:100%;display:block}
  .h5g-star:hover{transform:scale(1.12)}
  .h5g-star.on{color:var(--star)}
  .h5g-hint{font-size:12.5px;color:#8b919c;margin-top:14px;min-height:18px}
  .h5g-state{display:none;padding:14px 6px 4px}
  .h5g-state.show{display:block;animation:h5grise .4s both}
  .h5g-spin{width:34px;height:34px;margin:6px auto 14px;border-radius:50%;border:3px solid #eee;border-top-color:var(--brand);animation:h5gspin .7s linear infinite}
  @keyframes h5gspin{to{transform:rotate(360deg)}}
  .h5g-state p{color:var(--muted);font-size:15px;margin:0}
  .h5g-state .big{color:var(--ink);font-weight:800;font-size:19px;margin-bottom:4px}
  .h5g-foot{margin-top:26px;padding-top:16px;border-top:1px solid #EEF0F3;font-size:12px;color:#8b919c;line-height:1.6}
  .h5g-foot a{color:#8b919c;text-decoration:none}
  @media(max-width:420px){.h5g-card{padding:30px 22px 22px}.h5g-card h1{font-size:20px}.h5g-star{width:40px;height:40px}}
</style>

<div class="h5g-wrap">
  <main class="h5g-card">
    <img class="h5g-logo" src="/assets/logo.png" alt="The High 5 Guys" />
    <div class="h5g-wordmark">The High 5 Guys</div>
    <div id="h5gRate">
      <h1>How was your experience<br />with The High 5 Guys?</h1>
      <p class="h5g-sub">Zero cheesiness. 100% connection.<br />Tap a star to rate your event.</p>
      <div class="h5g-stars" id="h5gStars"></div>
      <div class="h5g-hint">5 = Excellent &nbsp;🙌 🙌 🙌</div>
    </div>
    <div class="h5g-state" id="h5gThanks">
      <div class="h5g-spin"></div>
      <p class="big" id="h5gBig">Thank you!</p>
      <p id="h5gMsg">We opened Google so you can share your review&hellip;</p>
    </div>
    <div class="h5g-foot">
      &copy; <span id="h5gYr"></span> The High 5 Guys &nbsp;&bull;&nbsp; Ponte Vedra, FL<br />
      <a href="tel:9047355275">(904) 735-5275</a>
    </div>
  </main>
</div>

<script>
(function(){
  var CONFIG = {
    googleReviewUrl: "https://g.page/r/CU2vLhmq5HtEEAI/review",
    feedbackSurveyUrl: "/feedback",
    thankYouUrl: "/thank-you",
    positiveThreshold: 4,
    redirectDelay: 700
  };
  var SVG='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.4l2.9 5.9 6.5.95-4.7 4.58 1.11 6.47L12 17.77 6.19 20.8 7.3 14.33 2.6 9.75l6.5-.95L12 2.4z"/></svg>';
  var wrap=document.getElementById('h5gStars'), rateBox=document.getElementById('h5gRate'),
      thanks=document.getElementById('h5gThanks'), hint=document.querySelector('.h5g-hint'),
      els=[], locked=false;
  document.getElementById('h5gYr').textContent=new Date().getFullYear();
  function paint(n){els.forEach(function(s,i){s.classList.toggle('on',i<n)})}
  for(var i=1;i<=5;i++){(function(n){
    var s=document.createElement('div');s.className='h5g-star';s.setAttribute('role','button');
    s.setAttribute('tabindex','0');s.setAttribute('aria-label',n+' star'+(n>1?'s':''));s.innerHTML=SVG;
    s.addEventListener('mouseenter',function(){if(!locked)paint(n)});
    s.addEventListener('click',function(){choose(n)});
    s.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(n)}});
    wrap.appendChild(s);els.push(s);
  })(i)}
  wrap.addEventListener('mouseleave',function(){if(!locked)paint(0)});
  function choose(n){
    if(locked)return;locked=true;paint(n);
    var big=document.getElementById('h5gBig'), msg=document.getElementById('h5gMsg');
    if(n>=CONFIG.positiveThreshold){
      window.open(CONFIG.googleReviewUrl,'_blank');
      big.textContent='Thank you!';
      msg.innerHTML='We opened Google so you can share your review&hellip;';
      setTimeout(function(){
        rateBox.style.display='none';thanks.classList.add('show');if(hint)hint.textContent='';
        setTimeout(function(){window.location.href=CONFIG.thankYouUrl+'?rating='+n;},CONFIG.redirectDelay);
      },200);
    }else{
      big.textContent='Thank you for the feedback';
      msg.innerHTML='We want to make this right. One quick moment&hellip;';
      setTimeout(function(){
        rateBox.style.display='none';thanks.classList.add('show');if(hint)hint.textContent='';
        setTimeout(function(){window.location.href=CONFIG.feedbackSurveyUrl+'?rating='+n;},CONFIG.redirectDelay);
      },260);
    }
  }
})();
</script>
</body>
</html>
