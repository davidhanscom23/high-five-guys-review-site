<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you! | The High 5 Guys</title>
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="Thank you! | The High 5 Guys">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<style>html,body{margin:0;padding:0}</style>
</head>
<body>
<style>
  .h5g-wrap{
    --brand:#E60000;--brand-dark:#B80000;--ink:#111111;--muted:#555B66;--card:#fff;--radius:22px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);position:fixed;inset:0;overflow-y:auto;min-height:100vh;width:100%;
    display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;
    background:linear-gradient(155deg,#0b0b0b 0%,#161616 55%,#7a0000 100%);
  }
  .h5g-wrap *{box-sizing:border-box}
  .h5g-card{
    width:100%;max-width:460px;background:var(--card);border-radius:var(--radius);
    padding:40px 34px 30px;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);
    text-align:center;position:relative;overflow:hidden;
    animation:h5grise .5s cubic-bezier(.2,.7,.2,1) both;
  }
  .h5g-card::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;
    background:linear-gradient(90deg,var(--ink),var(--brand))}
  @keyframes h5grise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .h5g-logo{height:84px;width:auto;margin:2px auto 6px;display:block}
  .h5g-wordmark{font-size:13px;font-weight:800;letter-spacing:.32em;color:var(--ink);margin-bottom:20px;text-transform:uppercase}
  .h5g-emoji{font-size:44px;line-height:1;margin:2px 0 10px}
  .h5g-card h1{font-size:25px;line-height:1.25;font-weight:800;margin:0 0 10px;letter-spacing:-.01em}
  .h5g-sub{font-size:15.5px;color:var(--muted);margin:0 0 24px;line-height:1.55}
  .h5g-btn{
    display:inline-block;background:var(--brand);color:#fff;text-decoration:none;
    font-weight:700;font-size:15px;padding:14px 26px;border-radius:12px;
    transition:transform .12s,background .12s;box-shadow:0 8px 20px -6px rgba(230,0,0,.55);
  }
  .h5g-btn:hover{transform:translateY(-1px);background:var(--brand-dark)}
  .h5g-foot{margin-top:28px;padding-top:16px;border-top:1px solid #EEF0F3;font-size:12px;color:#8b919c;line-height:1.6}
  .h5g-foot a{color:#8b919c;text-decoration:none}
  @media(max-width:420px){.h5g-card{padding:34px 22px 24px}.h5g-card h1{font-size:22px}}
</style>

<div class="h5g-wrap">
  <main class="h5g-card">
    <img class="h5g-logo" src="/assets/logo.png" alt="The High 5 Guys" />
    <div class="h5g-wordmark">The High 5 Guys</div>
    <div class="h5g-emoji">🙌</div>
    <h1>Thank you!</h1>
    <p class="h5g-sub">We just opened Google in a new tab so you can share your experience.<br />Your review means the world to us and helps other teams find us.</p>
    <a class="h5g-btn" href="https://g.page/r/CU2vLhmq5HtEEAI/review" target="_blank" rel="noopener">Leave your Google review &rarr;</a>
    <div class="h5g-foot">
      &copy; <span id="h5gYr"></span> The High 5 Guys &nbsp;&bull;&nbsp; Ponte Vedra, FL<br />
      <a href="tel:9047355275">(904) 735-5275</a>
    </div>
  </main>
</div>
<script>
document.getElementById('h5gYr').textContent=new Date().getFullYear();
</script>
</body>
</html>
